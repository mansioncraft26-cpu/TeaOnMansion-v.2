      document.getElementById("products");

      document.getElementById("error");


    try {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*`,
        {

          headers: {
            "apikey": SUPABASE_ANON_KEY,

            "Authorization":

          }
        }
      );


      if (!response.ok) {

          await response.text();

        throw new Error(

        );
      }


      products =
        await response.json();


      status.textContent =
        "Connected ✓";

      status.style.color =
        "green";


      productsContainer.innerHTML =
        "";


      if (products.length === 0) {

          >

          </button>

        `;


        productsContainer.appendChild(card);

      });

    }

    catch (error) {

async function loadTodayOrders() {

  const ordersList =
    document.getElementById(
      "today-orders-list"
    );

  const orderCount =
    document.getElementById(
      "today-order-count"
    );

  const todaySales =
    document.getElementById(
      "today-sales"
    );


  ordersList.innerHTML =
    `<div class="empty-cart">
      Loading orders...
    </div>`;


  try {

    // Thailand local day
    const now =
      new Date();


    const thailandDate =
      new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: "Asia/Bangkok",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }
      ).format(now);


    const start =
      new Date(
        `${thailandDate}T00:00:00+07:00`
      );


    const end =
      new Date(start.getTime() + 86400000);


    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/orders` +
        `?select=*` +
        `&created_at=gte.${encodeURIComponent(start.toISOString())}` +
        `&created_at=lt.${encodeURIComponent(end.toISOString())}` +
        `&order=created_at.desc`,
        {
          method: "GET",

          headers: {
            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`
          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Orders request failed:
${response.status}
${errorText}`
      );
    }


    const orders =
      await response.json();


    // ----------------------------------------
    // SUMMARY
    // ----------------------------------------

    const totalSales =
      orders.reduce(
        (sum, order) =>
          sum + Number(order.total || 0),
        0
      );


    orderCount.textContent =
      `${orders.length} ${
        orders.length === 1
          ? "order"
          : "orders"
      }`;


    todaySales.textContent =
      `฿${totalSales.toFixed(2)}`;


    // ----------------------------------------
    // EMPTY
    // ----------------------------------------

    if (orders.length === 0) {

      ordersList.innerHTML = `

        <div class="empty-cart">
          No orders today.
        </div>

      `;

      return;
    }


    // ----------------------------------------
    // DISPLAY ORDERS
    // ----------------------------------------

    ordersList.innerHTML = "";


    orders.forEach(order => {

      const row =
        document.createElement("div");


      row.className =
        "order-row";


      const orderDate =
        new Date(order.created_at);


      const time =
        orderDate.toLocaleTimeString(
          "en-GB",
          {
            timeZone: "Asia/Bangkok",
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      const status =
        order.status || "completed";


      row.innerHTML = `

        <div>

          <div class="order-number">
            ${order.order_number}
          </div>

          <div class="order-time">
            Today • ${time}
          </div>

        </div>


        <div>
          ${order.order_type || "delivery"}
        </div>


        <div>

          <span class="order-status">
            ${status}
          </span>

        </div>


        <div class="order-total">
          ฿${Number(order.total || 0).toFixed(2)}
        </div>

      `;


      ordersList.appendChild(row);

    });

  }

  catch (error) {

    console.error(error);


    ordersList.innerHTML = `

      <div
        style="
          color:#b00020;
          white-space:pre-wrap;
        "
      >
        ${error.message}
      </div>

    `;

  }

}

  // ==========================================

  function addToCart(productId) {

    const product =
      products.find(
        p => p.id === productId
      );


    if (!product) {
      return;
    }


    const existingItem =
      cart.find(
        item =>
          item.productId === productId
      );


    if (existingItem) {

      existingItem.quantity += 1;

    } else {

      cart.push({

        productId:
          product.id,

        name:
          product.name,

        price:
          Number(product.price),

        quantity:
          1

      });

    }


    renderCart();
  }


  // ==========================================
  // CHANGE QUANTITY
  // ==========================================

  function changeQuantity(
    productId,
    amount
  ) {

    const item =
      cart.find(
        item =>
          item.productId === productId
      );


    if (!item) {
      return;
    }


    item.quantity += amount;


    if (item.quantity <= 0) {

      cart =
        cart.filter(
          item =>
            item.productId !== productId
        );
    }


    renderCart();
  }


  // ==========================================
  // REMOVE ITEM
  // ==========================================

  function removeFromCart(productId) {

    cart =
      cart.filter(
        item =>
          item.productId !== productId
      );


    renderCart();
  }


  // ==========================================
  // CLEAR CART
  // ==========================================

  function clearCart() {

    cart = [];

    document.getElementById(
      "order-notes"
    ).value = "";

    renderCart();
  }


  // ==========================================
  // CALCULATE TOTAL
  // ==========================================

  function calculateTotal() {

    return cart.reduce(
      (total, item) => {

        return total +
          (item.price * item.quantity);

      },
      0
    );
  }


  // ==========================================
  // RENDER CART
  // ==========================================

  function renderCart() {

    const cartContainer =
      document.getElementById("cart");

    const totalElement =
      document.getElementById("cart-total");

    const checkoutButton =
      document.getElementById(
        "checkout-button"
      );


    if (cart.length === 0) {

      cartContainer.innerHTML = `

        <div class="empty-cart">
          No items in order
        </div>

      `;


      totalElement.textContent =
        "฿0.00";


      checkoutButton.disabled =
        true;


      return;
    }


    cartContainer.innerHTML =
      "";


    let total = 0;


    cart.forEach(item => {

      const itemSubtotal =
        item.price *
        item.quantity;


      total += itemSubtotal;


      const element =
        document.createElement("div");


      element.className =
        "cart-item";


      element.innerHTML = `

        <div>

          <div class="cart-item-name">
            ${item.name}
          </div>

          <div class="cart-item-price">
            ฿${item.price.toFixed(2)}
            each
          </div>

          <div class="quantity-controls">

            <button
              onclick="
                changeQuantity(
                  ${item.productId},
                  -1
                )
              "
            >
              −
            </button>


            <span class="quantity">
              ${item.quantity}
            </span>


            <button
              onclick="
                changeQuantity(
                  ${item.productId},
                  1
                )
              "
            >
              +
            </button>


            <button
              class="remove-button"
              onclick="
                removeFromCart(
                  ${item.productId}
                )
              "
            >
              Remove
            </button>

          </div>

        </div>


        <div>
          ฿${itemSubtotal.toFixed(2)}
        </div>

      `;


      cartContainer.appendChild(element);

    });


    totalElement.textContent =
      `฿${total.toFixed(2)}`;


    checkoutButton.disabled =
      false;
  }

    const day =

      ).padStart(2, "0");


    const time =
      String(
        now.getTime()
      ).slice(-6);


    return `MC-${year}${month}${day}-${time}`;
  }

          `${SUPABASE_URL}/rest/v1/order_items`,
          {
            method: "POST",

            headers: {

              "apikey":
                SUPABASE_ANON_KEY,

              "Authorization":
                `Bearer ${SUPABASE_ANON_KEY}`,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"
            },

            body:
              JSON.stringify(orderItems)
          }
        );


      if (!itemsResponse.ok) {

        const errorText =
          await itemsResponse.text();

        throw new Error(
          `Order items failed:
${itemsResponse.status}
${errorText}`
        );
      }


      // ----------------------------------------

      successContainer.textContent =

      successContainer.style.display =
        "block";


      cart = [];


      document.getElementById(
        "order-notes"
      ).value = "";
