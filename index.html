<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mansion.craft POS v2</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    #status {
      font-weight: bold;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .product h3 {
      margin-top: 0;
    }

    .category {
      color: #777;
      margin-bottom: 10px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .error {
      color: #b00020;
      white-space: pre-wrap;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>Mansion.craft</h1>
  <p>POS v2</p>
</header>

<main>

  <div class="status">
    Database status:
    <span id="status">Connecting...</span>

    <div id="error" class="error"></div>
  </div>

  <h2>Products</h2>

  <div id="products">
    Loading...
  </div>

</main>

<script>

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";

  const SUPABASE_ANON_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


  // ==========================================
  // LOAD PRODUCTS
  // ==========================================

  async function loadProducts() {

    const status = document.getElementById("status");
    const productsContainer = document.getElementById("products");
    const errorContainer = document.getElementById("error");

    try {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*`,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          }
        }
      );

      if (!response.ok) {

        const errorText = await response.text();

        throw new Error(
          `Supabase error ${response.status}\n${errorText}`
        );
      }

      const products = await response.json();

      status.textContent = "Connected ✓";
      status.style.color = "green";

      productsContainer.innerHTML = "";

      if (products.length === 0) {

        productsContainer.innerHTML =
          "<p>No products found.</p>";

        return;
      }

      products.forEach(product => {

        const card = document.createElement("div");

        card.className = "product";

        card.innerHTML = `
          <h3>${product.name}</h3>

          <div class="category">
            ${product.category || ""}
          </div>

          <div class="price">
            ฿${Number(product.price).toFixed(2)}
          </div>

          <button>
            Add to Order
          </button>
        `;

        productsContainer.appendChild(card);

      });

    }

    catch (error) {

      status.textContent = "Connection failed";
      status.style.color = "#b00020";

      productsContainer.innerHTML = "";

      errorContainer.textContent =
        error.message;

      console.error(error);
    }
  }


  // ==========================================
  // START
  // ==========================================

  loadProducts();

</script>

</body>
</html>
